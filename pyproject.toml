[project]
name = "ecb-fx-pipeline"
version = "0.1.0"
description = "Pipeline batch des taux de change de référence de la BCE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "pytest>=9",
    "pre-commit>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W : style, F : erreurs réelles, I : tri des imports,
# B : bugs probables, UP : syntaxe Python moderne
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
